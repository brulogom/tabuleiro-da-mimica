<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FF5A36">
<meta name="description" content="Jogo de mímica em tabuleiro para jogar em equipes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mímica">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>body{margin:0;}</style>
<script>
(function(){
  if (window.claude && typeof window.claude.use === "function") return;
  var KEY = "mimica:categories/words";
  var listeners = [];
  function read(){ try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; } }
  function write(data){ try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} }
  function snap(){ var d = read(); return { exists: !!d, data: function(){ return d; } }; }
  var doc = {
    get: function(){ return Promise.resolve(snap()); },
    set: function(data){ write(data); return Promise.resolve(); },
    update: function(patch){ var d = read() || {}; Object.keys(patch).forEach(function(k){ d[k] = patch[k]; }); write(d); return Promise.resolve(); },
    onSnapshot: function(cb){ listeners.push(cb); return function(){}; }
  };
  window.claude = { use: function(name){ return Promise.resolve(name === "db" ? { doc: function(){ return doc; } } : null); } };
})();
</script>
<title>Tabuleiro da Mímica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root{
    --bg:#EEF0E6;
    --surface:#FFFFFF;
    --surface-2:#E3E6D6;
    --text:#1E2A22;
    --text-muted:#5B6656;
    --border:#D3D6C4;
    --accent:#FF5A36;
    --accent-ink:#FFFFFF;
    --danger:#C94A42;
    --ok:#3E8E52;

    --c-lugar:#3B7EA1;
    --c-animal:#4C9A5B;
    --c-famosos:#D9A22B;
    --c-filmes:#C94A42;
    --c-musica:#C85A96;
    --c-profissoes:#D97F35;
    --c-esportes:#7C5FB5;
    --c-expressoes:#2F9C97;
    --c-comidas:#8A5A3B;
    --c-frases:#5C7A38;
    --c-aleatoria:#4A4A55;
    --c-special:#B8901F;

    --board-bg:#183226;
    --board-track:#22462F;
    --board-text:#F4F1DF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12201A;
      --surface:#1B2B23;
      --surface-2:#223428;
      --text:#EDF1E6;
      --text-muted:#9FAE97;
      --border:#2E4235;
      --accent:#FF6A47;
      --accent-ink:#12201A;
      --danger:#E27168;
      --ok:#57B36C;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12201A;
    --surface:#1B2B23;
    --surface-2:#223428;
    --text:#EDF1E6;
    --text-muted:#9FAE97;
    --border:#2E4235;
    --accent:#FF6A47;
    --accent-ink:#12201A;
    --danger:#E27168;
    --ok:#57B36C;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',system-ui,sans-serif;
    padding:18px 16px 40px;
    display:flex;
    flex-direction:column;
    gap:16px;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Baloo 2','Manrope',system-ui,sans-serif; margin:0; text-wrap:balance;}
  button{font-family:inherit; cursor:pointer;}
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--accent); outline-offset:2px;
  }

  .wrap{max-width:1180px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:16px;}

  header.app-header{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .mark{
    width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  }
  .brand h1{font-size:1.5rem; font-weight:800; letter-spacing:.2px;}
  .brand p{margin:0; font-size:.8rem; color:var(--text-muted); font-weight:600;}
  .ghost-btn{
    background:transparent; border:1.5px solid var(--border); color:var(--text-muted);
    padding:8px 14px; border-radius:10px; font-weight:700; font-size:.85rem;
  }
  .ghost-btn:hover{border-color:var(--accent); color:var(--accent);}
  .exit-btn{align-self:flex-start;}
  .ghost-btn:disabled{opacity:.45; cursor:not-allowed;}
  .ghost-btn:disabled:hover{border-color:var(--border); color:var(--text-muted);}
  .header-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .word-list{display:flex; flex-wrap:wrap; gap:6px;}
  .word-chip{display:inline-flex; align-items:center; gap:6px; color:#fff; padding:6px 6px 6px 12px; border-radius:999px; font-weight:700; font-size:.82rem;}
  .word-chip.is-filtered-out{opacity:.25;}
  .word-x{background:rgba(0,0,0,.25); border:none; color:#fff; width:20px; height:20px; border-radius:50%; font-size:.85rem; line-height:1; padding:0;}
  .word-x:hover{background:rgba(0,0,0,.45);}
  .add-word-row{display:flex; gap:8px;}
  .add-word-row input{
    flex:1; min-width:0; border:1.5px solid var(--border); border-radius:10px; padding:10px 12px;
    font-size:.95rem; background:var(--surface); color:var(--text); font-weight:600;
  }
  .add-word-row input:focus{border-color:var(--accent);}

  /* ---------- SETUP SCREEN ---------- */
  .setup-card{
    background:var(--surface); border:1px solid var(--border); border-radius:20px;
    padding:28px; display:flex; flex-direction:column; gap:22px;
  }
  .setup-card h2{font-size:1.3rem;}
  .setup-card .lede{color:var(--text-muted); font-size:.92rem; margin-top:4px; max-width:60ch;}
  .field-group{display:flex; flex-direction:column; gap:10px;}
  .field-label{font-weight:800; font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    border:1.5px solid var(--border); background:var(--surface-2); color:var(--text);
    padding:8px 16px; border-radius:999px; font-weight:700; font-size:.9rem;
  }
  .chip.is-active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .team-rows{display:flex; flex-direction:column; gap:14px;}
  .team-row-block{display:flex; flex-direction:column; gap:8px;}
  .team-row{display:flex; align-items:center; gap:10px;}
  .team-dot{width:28px;height:28px;border-radius:50%; flex-shrink:0; border:2px solid rgba(0,0,0,.15);}
  .color-swatch-row{display:flex; gap:8px; flex-wrap:wrap; padding-left:38px;}
  .color-swatch-btn{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--border); padding:0; cursor:pointer;
  }
  .color-swatch-btn.is-selected{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent);}
  .color-swatch-btn:disabled{opacity:.2; cursor:not-allowed;}
  .team-row input{
    flex:1; min-width:0; border:1.5px solid var(--border); border-radius:10px; padding:10px 12px;
    font-size:.95rem; font-weight:700; background:var(--surface); color:var(--text);
  }
  .team-row input:focus{border-color:var(--accent);}
  .start-btn{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:14px;
    padding:16px 20px; font-size:1.05rem; font-weight:800; align-self:flex-start;
  }
  .start-btn:hover{filter:brightness(1.06);}
  .start-btn:disabled{cursor:not-allowed;}
  .start-btn:disabled:hover{filter:none;}

  /* ---------- GAME SCREEN ---------- */
  .board-screen{ display:flex; flex-direction:column; gap:14px; width:100%; }
  .board-main{ display:flex; flex-direction:column; gap:14px; min-width:0; }
  @media (min-width:800px){
    .board-screen{ flex-direction:row; align-items:flex-start; }
    .board-main{ flex:1; min-width:0; }
  }
  .category-legend{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:14px; display:flex; flex-direction:column; gap:8px; flex-shrink:0;
  }
  @media (min-width:800px){ .category-legend{ width:190px; position:sticky; top:16px; } }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:.82rem; font-weight:700; }
  .legend-swatch{
    width:26px; height:26px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1rem; color:#fff;
  }
  .stage-screen{ display:flex; flex-direction:column; gap:14px; width:100%; align-items:stretch; }

  .board-panel{
    background:var(--board-bg); border-radius:20px; padding:18px; overflow-x:auto;
  }
  .board-title{color:var(--board-text); font-weight:800; font-size:.95rem; margin:0 0 12px 4px; display:flex; justify-content:space-between; align-items:center;}
  .board-title span.sub{color:#B7C9BC; font-weight:600; font-size:.8rem;}
  .board-grid{
    display:grid; grid-template-columns:repeat(6, 1fr); grid-auto-rows:58px; gap:6px; position:relative;
    background:var(--board-track); border-radius:16px; padding:12px;
  }
  .house{
    width:100%; height:100%; box-sizing:border-box; min-width:0;
    border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#fff; font-weight:800; position:relative; font-size:.68rem; line-height:1.1; gap:1px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);
  }
  .house .num{font-family:'Baloo 2'; font-size:.9rem;}
  .house .ic{font-size:1rem;}
  .house.is-start, .house.is-finish{
    background:var(--accent); color:var(--accent-ink); font-family:'Baloo 2'; font-size:.72rem;
  }
  .house.is-current-target{box-shadow:0 0 0 2px #fff;}
  .dir-arrow{
    position:absolute; top:1px; right:2px;
    font-size:1.05rem; font-weight:800; line-height:1; color:rgba(255,255,255,.95);
    text-shadow:0 1px 1px rgba(0,0,0,.4); pointer-events:none; z-index:2;
  }
  .pawns{
    position:absolute; bottom:2px; left:0; display:flex; gap:2px; flex-wrap:wrap;
    justify-content:center; width:100%; pointer-events:none; z-index:2;
  }
  .pawn{width:11px;height:11px;border-radius:50%; border:1.5px solid rgba(255,255,255,.9); box-shadow:0 0 0 1px rgba(0,0,0,.25);}
  .pawn-pin{
    width:15px; height:15px; flex-shrink:0;
    border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    border:1.5px solid rgba(255,255,255,.95); box-shadow:0 1px 3px rgba(0,0,0,.45);
  }
  @media (max-width:480px){
    .board-grid{grid-auto-rows:46px; gap:4px; padding:8px;}
  }

  .board-action{display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;}
  .board-action-msg{font-weight:700; color:var(--text-muted); font-size:.95rem;}

  .turn-banner{
    display:flex; align-items:center; gap:12px; border-radius:14px; padding:12px 14px;
    color:#fff; font-family:'Baloo 2'; font-size:1.05rem;
  }
  .turn-banner .pawn-lg{width:20px;height:20px;border-radius:50%; border:2px solid rgba(255,255,255,.85); flex-shrink:0;}
  .turn-banner .pos{margin-left:auto; font-size:.8rem; font-family:'Manrope'; font-weight:700; opacity:.9;}

  .target-chip{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px;
    border:1.5px dashed var(--border); font-weight:700; font-size:.9rem;
  }
  .target-chip .swatch{width:30px;height:30px;border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1rem; color:#fff; flex-shrink:0;}
  .target-chip .lbl{color:var(--text-muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; font-weight:800;}
  .target-chip .name{font-size:1rem;}

  .stage{
    background:var(--surface-2); border-radius:16px; padding:22px 18px; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:14px; min-height:170px; justify-content:center;
  }
  .stage .prompt{color:var(--text-muted); font-weight:700; font-size:.95rem;}
  .stage .word{font-family:'Baloo 2'; font-size:1.9rem; font-weight:800; text-wrap:balance; word-break:break-word;}
  .stage .artist-hint{color:var(--text-muted); font-weight:700; font-size:.85rem; margin-top:-8px;}
  .hint-toggle{
    background:none; border:1.5px dashed var(--border); color:var(--text-muted); font-weight:700;
    font-size:.8rem; border-radius:999px; padding:5px 12px;
  }
  .hint-toggle:hover{border-color:var(--accent); color:var(--accent);}
  .hint-body{
    color:var(--text-muted); font-weight:600; font-size:.85rem; line-height:1.4; max-width:38ch;
    background:var(--surface); border-radius:10px; padding:10px 12px;
  }
  .stage-big{flex:1; min-height:min(60vh, 520px); padding:32px 20px; gap:20px;}
  .stage-big .prompt{font-size:1.1rem;}
  .stage-big .word{font-size:clamp(2.2rem, 7vw, 3.4rem);}
  .stage-big .artist-hint{font-size:1rem;}
  .stage-big .timer-wrap{max-width:360px; width:100%;}
  .stage-big .result-btns{max-width:420px; width:100%;}
  .reveal-btn{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px;
    padding:14px 22px; font-weight:800; font-size:1rem;
  }
  .timer-wrap{width:100%; display:flex; flex-direction:column; gap:6px;}
  .timer-bar-track{width:100%; height:10px; background:var(--border); border-radius:999px; overflow:hidden;}
  .timer-bar-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .12s linear;}
  .timer-num{font-family:'Baloo 2'; font-size:1.3rem; font-variant-numeric:tabular-nums;}
  .result-btns{display:flex; gap:10px; width:100%;}
  .result-btns button{
    flex:1; border:none; border-radius:12px; padding:13px 10px; font-weight:800; font-size:.92rem; color:#fff;
  }
  .btn-ok{background:var(--ok);}
  .btn-skip{background:var(--danger);}
  .btn-continue{background:var(--accent); color:var(--accent-ink); width:100%; border:none; border-radius:12px; padding:13px 10px; font-weight:800;}

  .scoreboard{display:flex; flex-direction:column; gap:8px;}
  .scoreboard .lbl{font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; font-weight:800; color:var(--text-muted);}
  .score-row{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:10px; font-weight:700; font-size:.85rem;}
  .score-row.is-current{background:var(--surface-2);}
  .score-row .pawn{width:14px;height:14px; flex-shrink:0;}
  .score-row .nm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .score-row .pn{color:var(--text-muted); font-variant-numeric:tabular-nums;}

  .rules-toggle{background:none; border:none; color:var(--text-muted); font-weight:700; font-size:.8rem; text-align:left; padding:0; text-decoration:underline;}
  .rules-body{font-size:.85rem; color:var(--text-muted); line-height:1.5; display:flex; flex-direction:column; gap:6px;}
  .rules-body b{color:var(--text);}

  /* ---------- MODALS ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,15,12,.55); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .modal-card{
    background:var(--surface); border-radius:18px; padding:26px; max-width:420px; width:100%;
    display:flex; flex-direction:column; gap:14px; text-align:center;
  }
  .modal-card h3{font-size:1.4rem;}
  .modal-card-wide{max-width:480px;}
  .qr-box{background:#FFFFFF; border-radius:14px; padding:10px; width:min(72vw, 300px); margin:0 auto;}
  .qr-box svg{display:block; width:100%; height:auto;}
  .qr-link{font-weight:700; font-size:.85rem; color:var(--text-muted); word-break:break-all; margin:0;}
  .team-report-list{display:flex; flex-direction:column; gap:10px; max-height:min(50vh, 420px); overflow-y:auto; text-align:left;}
  .team-report-row{background:var(--surface-2); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:6px;}
  .team-report-head{display:flex; align-items:center; gap:8px; font-family:'Baloo 2'; font-weight:700; font-size:1rem;}
  .team-report-stats{display:flex; gap:14px; font-weight:700; font-size:.88rem; font-variant-numeric:tabular-nums;}
  .team-report-cats{display:flex; flex-direction:column; gap:2px; font-size:.82rem; color:var(--text-muted); font-weight:600;}
  .cat-pick-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .cat-pick-btn{
    border:none; border-radius:12px; padding:12px 8px; color:#fff; font-weight:800; font-size:.85rem;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .cat-pick-btn small{font-weight:700; font-size:.68rem; opacity:.9; text-transform:none;}
  .confetti-emoji{font-size:2.6rem;}

  [hidden]{display:none !important;}

  @media (max-width:480px){
    .brand h1{font-size:1.25rem;}
  }
</style>

<style>
  body{padding-top:max(18px, env(safe-area-inset-top)); padding-left:max(16px, env(safe-area-inset-left)); padding-right:max(16px, env(safe-area-inset-right)); padding-bottom:max(40px, env(safe-area-inset-bottom));}
</style>
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="brand">
      <div class="mark">🎭</div>
      <div>
        <h1>Tabuleiro da Mímica</h1>
        <p>Cada acerto anda 1 casa</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="ghost-btn" id="btnQr">📱 QR CODE</button>
      <button class="ghost-btn" id="btnManage">📋 Gerenciar palavras</button>
    </div>
  </header>

  <section id="setupScreen"></section>
  <section id="gameScreen" hidden></section>
  <section id="manageScreen" hidden></section>
</div>

<div id="modalLayer"></div>

<script>
(function(){
  "use strict";

  var CATS = {
    lugar:      {label:"Lugar",                 icon:"🌍", color:"var(--c-lugar)"},
    animal:     {label:"Animal",                icon:"🐾", color:"var(--c-animal)"},
    famosos:    {label:"Pessoas Famosas",        icon:"⭐", color:"var(--c-famosos)"},
    filmes:     {label:"Filmes/Séries/Novelas",  icon:"🎬", color:"var(--c-filmes)"},
    musica:     {label:"Música",                 icon:"🎵", color:"var(--c-musica)"},
    profissoes: {label:"Profissões",             icon:"💼", color:"var(--c-profissoes)"},
    esportes:   {label:"Esportes/Ações",         icon:"⚽", color:"var(--c-esportes)"},
    expressoes: {label:"Expressões/Emoções",     icon:"😀", color:"var(--c-expressoes)"},
    comidas:    {label:"Comidas/Bebidas",        icon:"🍕", color:"var(--c-comidas)"},
    frases:     {label:"Frases Populares",       icon:"🗣️", color:"var(--c-frases)"},
    aleatoria:  {label:"Aleatória",              icon:"🎲", color:"var(--c-aleatoria)"}
  };

  var DEFAULT_WORDS = {

  // Lays out a fresh board template for a chosen board length: house 0 is
  // the start, house `steps` is the finish, and a handful of mystery
  // (special) houses are spread evenly among the rest, each starting with
  // a random hidden nature — every other house is a plain category slot,
  // its actual category decided later by buildEffectiveBoard.
  function generateBoardTemplate(steps){
    var len = steps + 1;
    var arr = new Array(len);
    arr[0] = {type:"start"};
    arr[len-1] = {type:"finish"};
    var specialCount = Math.max(2, Math.min(8, Math.round(steps/7)));
    var specialAt = {};
    for (var k=0;k<specialCount;k++){
      var pos = Math.max(1, Math.min(steps-1, Math.round((k+1) * steps/(specialCount+1))));
      while (specialAt[pos] && pos < steps-1) pos++;

  function wordsForMatch(catKey, noEnglish, brazilOnly){
    var full = wordBank[catKey] || [];
    var list = full;
    if (brazilOnly && NON_BRAZILIAN[catKey]){
      var nb = NON_BRAZILIAN[catKey];
      list = list.filter(function(w){ return nb.indexOf(w) === -1; });
    }
    if (noEnglish && ENGLISH_ONLY[catKey]){
      var eo = ENGLISH_ONLY[catKey];
      list = list.filter(function(w){ return eo.indexOf(w) === -1; });
    }
    // A filter that would empty out a category is ignored for it rather
    // than leaving the game with no words to draw.
    return list.length ? list : full;
  }

  var dbDoc = null;
  var dbAvailable = true;
  var manageState = { activeCat: "lugar", returnTo: "setup", languageFilter: "none" };

  function cloneWords(src){
    var out = {};
    Object.keys(src).forEach(function(k){ out[k] = src[k].slice(); });
    return out;
  }
  function mergeWithDefaults(data){
    var merged = {};
    Object.keys(DEFAULT_WORDS).forEach(function(k){
      var arr = data && Array.isArray(data[k]) ? data[k] : null;
      merged[k] = (arr && arr.length) ? arr.slice() : DEFAULT_WORDS[k].slice();
    });
    return merged;
  }

  async function initWordBank(){
    try{
      if (!window.claude || typeof window.claude.use !== "function"){ dbAvailable = false; return; }
      var db = await window.claude.use("db");
      if (!db){ dbAvailable = false; return; }
      dbDoc = db.doc("categories/words");
      var snap = await dbDoc.get();
      if (snap.exists){ wordBank = mergeWithDefaults(snap.data()); }
      else { await dbDoc.set(DEFAULT_WORDS); wordBank = cloneWords(DEFAULT_WORDS); }
      onWordBankChanged();
      dbDoc.onSnapshot(function(s){
        if (s.exists){ wordBank = mergeWithDefaults(s.data()); onWordBankChanged(); }
      }, function(){ dbAvailable = false; onWordBankChanged(); });
    } catch(e){
      dbAvailable = false;
      onWordBankChanged();
    }
  }
  function onWordBankChanged(){
    if (!setupEl.hidden) renderSetup();
    if (!manageEl.hidden) renderManage();
  }
  function persistCategory(catKey){
    if (!dbDoc) return;
    var patch = {}; patch[catKey] = wordBank[catKey];
    dbDoc.update(patch).catch(function(){ /* local edit stands even if the sync fails */ });
  }
  function addWord(catKey, raw){
    var word = (raw || "").trim();
    if (!word) return;
    var exists = wordBank[catKey].some(function(w){ return w.toLowerCase() === word.toLowerCase(); });
    if (exists) return;
    wordBank[catKey] = wordBank[catKey].concat([word]);
    renderManage();
    persistCategory(catKey);
  }
  function removeWord(catKey, word){
    wordBank[catKey] = wordBank[catKey].filter(function(w){ return w !== word; });
    renderManage();
    persistCategory(catKey);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, function(ch){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch];
    });
  }
  // Música entries are stored as "Título (Artista)" — split them so the
  // reveal shows the title big and the artist as a small hint underneath.
  function renderWordDisplay(word, catKey){
    var html;
    if (catKey === "musica"){
      var m = /^(.*)\s\(([^)]+)\)\s*$/.exec(word);
      html = m
        ? '<div class="word">'+escapeHtml(m[1])+'</div><div class="artist-hint">('+escapeHtml(m[2])+')</div>'
        : '<div class="word">'+escapeHtml(word)+'</div>';
    } else {
      html = '<div class="word">'+escapeHtml(word)+'</div>';
    }
    var hint = HINTS[catKey] && HINTS[catKey][word];
    if (hint){
      html += '<button type="button" class="hint-toggle" id="btnHintToggle">ⓘ Dica</button>' +
        '<div class="hint-body" id="hintBody" hidden>'+escapeHtml(hint)+'</div>';
    }
    return html;
  }
  function wireHintToggle(){
    var btn = document.getElementById("btnHintToggle");
    if (btn) btn.addEventListener("click", function(){
      document.getElementById("hintBody").hidden = !document.getElementById("hintBody").hidden;
    });
  }

  var deck = {}; // shuffled word pointers per category
  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function initDeck(noEnglish, brazilOnly){
    deck = {};
    Object.keys(wordBank).forEach(function(k){
      var words = wordsForMatch(k, noEnglish, brazilOnly);
      if (words.length) deck[k] = {list: shuffle(words), ptr:0};
    });
  }
  function drawWord(catKey){
    var pool = catKey === "aleatoria"
      ? ((state && state.activeCatPool && state.activeCatPool.length) ? state.activeCatPool.filter(function(k){ return !!deck[k]; }) : Object.keys(deck))
      : [catKey];
    var chosenCat = pool[Math.floor(Math.random()*pool.length)];
    var d = deck[chosenCat];
    if (!d || d.ptr >= d.list.length){
      var words = wordsForMatch(chosenCat, state.noEnglish, state.brazilOnly);
      d = {list: shuffle(words), ptr:0};
      deck[chosenCat] = d;
    }
    var w = d.list[d.ptr]; d.ptr++;
    return {word:w, catKey: chosenCat};
  }

  var state = null;

  function newState(numTeams, names, timerSec, enabledCats, steps, teamColors, noEnglish, brazilOnly){
    initDeck(noEnglish, brazilOnly);
    var teams = [];
    for (var i=0;i<numTeams;i++){
      var color = (teamColors && teamColors[i]) || defaultTeamColor(i);
      teams.push({
        name: (names[i] && names[i].trim()) || ("Equipe " + (i+1)),
        color: color,
        textColor: contrastTextFor(color),
        pos: 0,
        skipNext: false,
        categoryOverride: null,
        correct: 0,
        wrong: 0,
        byCategory: {} // catKey -> {correct, wrong}, filled in as words come up
      });
    }
    var template = generateBoardTemplate(steps);
    var board = buildEffectiveBoard(enabledCats, template) || buildEffectiveBoard(defaultEnabledCats(), template);
    return {
      teams: teams,
      current: 0,
      timerSec: timerSec,
      phase: "idle", // idle -> revealed -> ended -> (skip-msg / win)
      activeWord: null,
      activeCatKey: null,
      remaining: timerSec,
      timerId: null,
      winner: null,
      board: board,
      finishIdx: template.length - 1,
      activeCatPool: REAL_CAT_KEYS.filter(function(k){ return enabledCats[k]; }),
      aleatoriaEnabled: !!enabledCats.aleatoria,
      noEnglish: !!noEnglish,
      brazilOnly: !!brazilOnly
    };
  }
  function defaultEnabledCats(){
    var e = {};
    Object.keys(CATS).forEach(function(k){ e[k] = true; });
    return e;
  }

    setupEl.innerHTML =

      (function(idx){

  // ---------------- GAME SCREEN ----------------
  function houseColor(h){
    if (h.type === "cat") return CATS[h.cat].color;
    if (h.type === "special") return "var(--c-special)";
    return "var(--accent)";
  }
  function houseIcon(h){
    if (h.type === "cat") return CATS[h.cat].icon;
    if (h.type === "special") return "❓"; // hide which special it is — that's the mystery
    if (h.type === "start") return "🚩";
    return "🏁";
  }

  var COLS = 6;
  function cellPos(i){
    var row = Math.floor(i/COLS);
    var colInRow = i % COLS;
    var col = (row % 2 === 0) ? colInRow : (COLS-1-colInRow);
    return {row:row+1, col:col+1};
  }
  // Which way the snake path continues from house i to i+1 — the board
  // wraps rows in alternating directions, so a house at the end of a row
  // points down into the next one instead of sideways.
  function pathArrow(i, boardLen){
    if (i >= boardLen - 1) return null;
    var cur = cellPos(i), next = cellPos(i+1);
    if (cur.row !== next.row) return "↓";
    return next.col > cur.col ? "→" : "←";
  }

  function renderBoardOnly(){
    var holder = document.getElementById("boardHolder");
    if (holder) holder.innerHTML = renderBoardClean();
  }

  // Steps a team's pawn one house at a time toward toPos, re-rendering just
  // the board between steps so it visibly walks instead of teleporting.
  function animateMove(team, fromPos, toPos, onDone){
    var step = toPos > fromPos ? 1 : (toPos < fromPos ? -1 : 0);
    if (step === 0){ onDone(); return; }
    function tick(){
      team.pos += step;
      renderBoardOnly();
      if (team.pos === toPos) setTimeout(onDone, 150);
      else setTimeout(tick, 220);
    }
    setTimeout(tick, 220);
  }

  function renderBoardClean(){
    var board = state.board;
    var rows = Math.ceil(board.length/COLS);
    var team = state.teams[state.current];
    var cellsHtml = board.map(function(h, i){
      var p = cellPos(i);
      var isTarget = (team && !team.skipNext && team.pos === i);
      var bg = (h.type==="cat"||h.type==="special") ? houseColor(h) : "var(--accent)";
      var pawnsHtml = state.teams.filter(function(t){return t.pos === i;})
        .map(function(t){return '<span class="pawn-pin" style="background:'+t.color+'"></span>';}).join("");
      var titleLbl = h.type==="cat" ? CATS[h.cat].label : h.type==="special" ? "Casa misteriosa" : (h.type==="start"?"Largada":"Chegada");
      var inner = (h.type==="start"||h.type==="finish")
        ? '<span class="ic">'+houseIcon(h)+'</span><span class="num">'+(h.type==="start"?"Início":"Fim")+'</span>'
        : '<span class="ic">'+houseIcon(h)+'</span><span class="num">'+i+'</span>';
      var arrow = pathArrow(i, board.length);
      var arrowHtml = arrow ? '<span class="dir-arrow">'+arrow+'</span>' : '';
      return '<div class="house'+(h.type==="start"?" is-start":"")+(h.type==="finish"?" is-finish":"")+(isTarget?" is-current-target":"")+'" '+
        'style="grid-row:'+p.row+'; grid-column:'+p.col+'; '+((h.type==="cat"||h.type==="special")?'background:'+bg+';':'')+'" title="'+titleLbl+'">' +
        arrowHtml + inner + '<span class="pawns">'+pawnsHtml+'</span></div>';
    }).join("");
    return '<div class="board-panel"><h3 class="board-title">Tabuleiro <span class="sub">'+(state.finishIdx-1)+' casas até a chegada</span></h3>' +
      '<div class="board-grid" style="grid-template-rows:repeat('+rows+', 62px);">'+cellsHtml+'</div></div>';
  }

  function renderPanel(){
    var team = state.teams[state.current];
    var currentHouse = state.board[team.pos];
    var effectiveCatKey = team.categoryOverride ||
      (currentHouse.type==="cat" ? currentHouse.cat : (currentHouse.type==="special" ? "aleatoria" : null));
    var showBoard = state.phase === "idle" || state.phase === "moving" || state.phase === "skipmsg";

    if (showBoard) renderBoardScreen(team, currentHouse, effectiveCatKey);
    else renderStageScreen(team, currentHouse, effectiveCatKey);

    updateManageButtonState();
  }

  // Describes the house the pawn is standing on RIGHT NOW — that's the one
  // being mimicked; a correct guess is what moves the pawn off of it.
  function targetChipFor(house, effectiveCatKey, categoryOverride){
    if (house.type === "special" && !categoryOverride){
      return '<div class="target-chip"><div class="swatch" style="background:var(--c-special)">❓</div>' +
        '<div><div class="lbl">Casa atual</div><div class="name">Casa misteriosa</div></div></div>';
    }
    if (house.type === "start" && !categoryOverride){
      return '<div class="target-chip"><div class="swatch" style="background:var(--accent)">🎯</div>' +
        '<div><div class="lbl">Casa atual</div><div class="name">Casa inicial</div></div></div>';
    }
    if (effectiveCatKey){
      var c = CATS[effectiveCatKey];
      var mysteryNote = house.type === "special" ? " · casa misteriosa" : "";
      var overrideNote = (categoryOverride && house.type !== "special") ? " (escolhida)" : "";
      return '<div class="target-chip"><div class="swatch" style="background:'+c.color+'">'+c.icon+'</div>' +
        '<div><div class="lbl">Categoria da vez</div><div class="name">'+c.label+overrideNote+mysteryNote+'</div></div></div>';
    }
    return '<div class="target-chip"><div class="swatch" style="background:var(--accent)">🏁</div>' +
      '<div><div class="lbl">Casa atual</div><div class="name">Chegada!</div></div></div>';
  }

  // A sidebar decoding every color/icon on the board — only the categories
  // actually in play this match, plus the mystery houses.
  function renderCategoryLegend(){
    var items = state.activeCatPool.map(function(k){
      var c = CATS[k];
      return '<div class="legend-item"><span class="legend-swatch" style="background:'+c.color+'">'+c.icon+'</span>'+c.label+'</div>';
    }).join("");
    if (state.aleatoriaEnabled){
      var a = CATS.aleatoria;
      items += '<div class="legend-item"><span class="legend-swatch" style="background:'+a.color+'">'+a.icon+'</span>'+a.label+'</div>';
    }
    items += '<div class="legend-item"><span class="legend-swatch" style="background:var(--c-special)">❓</span>Casa misteriosa</div>';
    return '<div class="category-legend"><span class="field-label">Legenda</span>'+items+'</div>';
  }

  // Full-screen board: shown between turns and during walking animations —
  // never at the same time as the stage screen, so the board always gets
  // the whole viewport instead of sharing it with a side panel.
  function renderBoardScreen(team, currentHouse, effectiveCatKey){
    var needsCategoryChoice = !team.categoryOverride && state.phase === "idle" &&
      (currentHouse.type === "start" || currentHouse.type === "special");
    var actionHtml;
    if (state.phase === "skipmsg"){
      actionHtml = '<div class="board-action-msg">'+escapeHtml(team.name)+' perdeu a vez nesta rodada 😅</div>' +
        '<button class="reveal-btn" id="btnContinueSkip">Passar a vez</button>';
    } else if (state.phase === "moving"){
      actionHtml = '<div class="board-action-msg">🚶 Andando para a próxima casa...</div>';
    } else if (needsCategoryChoice){
      var choiceMsg = currentHouse.type === "special"
        ? "Casa misteriosa: escolha a categoria da sua mímica antes de tentar."
        : "Primeira mímica da equipe: escolha a categoria da sua palavra.";
      actionHtml = '<div class="board-action-msg">'+choiceMsg+'</div>' +
        '<button class="reveal-btn" id="btnChooseCategory">🎯 Escolher categoria</button>';
    } else {
      actionHtml = '<button class="reveal-btn" id="btnReveal">Próxima mímica 🎬</button>';
    }

    var scoreRows = state.teams.map(function(t, idx){
      return '<div class="score-row'+(idx===state.current?" is-current":"")+'">' +
        '<span class="pawn" style="background:'+t.color+'"></span>' +
        '<span class="nm">'+escapeHtml(t.name)+(t.skipNext?" (perde próxima)":"")+'</span>' +
        '<span class="pn">casa '+t.pos+'/'+state.finishIdx+'</span></div>';
    }).join("");

    gameEl.innerHTML =
      '<div class="board-screen">' +
        '<div class="board-main">' +
          '<button class="ghost-btn exit-btn" id="btnExitInGame">🏠 Menu principal</button>' +
          '<div class="turn-banner" style="background:'+team.color+'; color:'+team.textColor+'">' +
            '<span class="pawn-lg" style="background:'+team.color+'; border-color:'+team.textColor+'"></span>' +
            'Vez de '+escapeHtml(team.name) +
            '<span class="pos">casa '+team.pos+' de '+state.finishIdx+'</span>' +
          '</div>' +
          targetChipFor(currentHouse, effectiveCatKey, team.categoryOverride) +
          '<div id="boardHolder"></div>' +
          '<div class="board-action">'+actionHtml+'</div>' +
          '<div class="scoreboard"><span class="lbl">Placar</span>'+scoreRows+'</div>' +
          '<button class="rules-toggle" id="btnRules">Como jogar / casas misteriosas</button>' +
          '<div class="rules-body" id="rulesBody" hidden>' +
            '<div><b>Regra básica:</b> toque em "Próxima mímica" para ver a palavra e mimicar até a equipe adivinhar ou o tempo acabar.</div>' +
            '<div><b>🎯 Casa inicial e casas misteriosas:</b> antes de mimicar, a equipe escolhe a categoria da palavra (incluindo "Aleatória", se estiver ativada).</div>' +
            '<div><b>❓ Casa misteriosa:</b> pode ser uma sorte, um revés ou nada — só se revela ao tentar. Acertando uma sorte boa, ela é sua; errando, nada acontece (só não avança). Acertando um revés, você passa ileso; errando, sofre o revés (voltar 1 casa ou perder a próxima vez). Se for "nada", segue normal: avança 1 casa acertando, 0 errando. Se não conseguir passar, a sorte é sorteada de novo na próxima tentativa.</div>' +
            '<div><b>🎲 Aleatória:</b> a palavra pode vir de qualquer categoria.</div>' +
          '</div>' +
        '</div>' +
        renderCategoryLegend() +
      '</div>';

    renderBoardOnly();

    var rb = document.getElementById("btnRules");
    if (rb) rb.addEventListener("click", function(){
      document.getElementById("rulesBody").hidden = !document.getElementById("rulesBody").hidden;
    });
    var btnExitInGame = document.getElementById("btnExitInGame");
    if (btnExitInGame) btnExitInGame.addEventListener("click", confirmExitToMenu);
    var btnReveal = document.getElementById("btnReveal");
    if (btnReveal) btnReveal.addEventListener("click", function(){ startReveal(effectiveCatKey); });
    var btnChooseCategory = document.getElementById("btnChooseCategory");
    if (btnChooseCategory) btnChooseCategory.addEventListener("click", function(){
      openCategoryPicker(function(){
        startReveal(state.teams[state.current].categoryOverride);
      }, true);
    });
    var btnContinueSkip = document.getElementById("btnContinueSkip");
    if (btnContinueSkip) btnContinueSkip.addEventListener("click", function(){
      state.teams[state.current].skipNext = false;
      advanceTeamIndex();
      state.phase = "idle";
      renderPanel();
    });
  }

  // Full-screen stage: only the person mimicking sees this — no board, so
  // it never shares the screen with it.
  function renderStageScreen(team, currentHouse, effectiveCatKey){
    var chip = targetChipFor(currentHouse, effectiveCatKey, team.categoryOverride);
    var body;
    if (state.phase === "revealed"){
      body = '<div class="prompt">Mimique isto:</div>' +
        renderWordDisplay(state.activeWord, state.activeCatKey) +
        '<div class="timer-wrap"><div class="timer-bar-track"><div class="timer-bar-fill" id="timerFill" style="width:'+(state.remaining/state.timerSec*100)+'%"></div></div>' +
        '<div class="timer-num" id="timerNum">'+state.remaining+'s</div></div>' +
        '<div class="result-btns"><button class="btn-ok" id="btnAcertou">✅ Acertou</button><button class="btn-skip" id="btnPular">⏭️ Pular</button></div>';
    } else {
      body = '<div class="prompt">⏱️ Tempo esgotado!</div>' + renderWordDisplay(state.activeWord, state.activeCatKey) +
        '<button class="btn-continue" id="btnContinueTimeup">Passar a vez</button>';
    }

    gameEl.innerHTML =
      '<div class="stage-screen">' +
        '<button class="ghost-btn exit-btn" id="btnExitInGame">🏠 Menu principal</button>' +
        '<div class="turn-banner" style="background:'+team.color+'; color:'+team.textColor+'">' +
          '<span class="pawn-lg" style="background:'+team.color+'; border-color:'+team.textColor+'"></span>' +
          'Vez de '+escapeHtml(team.name) +
        '</div>' +
        chip +
        '<div class="stage stage-big">'+body+'</div>' +
      '</div>';

    var btnExitInGame = document.getElementById("btnExitInGame");
    if (btnExitInGame) btnExitInGame.addEventListener("click", confirmExitToMenu);
    var btnAcertou = document.getElementById("btnAcertou");
    if (btnAcertou) btnAcertou.addEventListener("click", function(){ scoreSuccess(); });
    var btnPular = document.getElementById("btnPular");
    if (btnPular) btnPular.addEventListener("click", function(){ vibrate(50); handleMimicFailure(); });
    var btnContinueTimeup = document.getElementById("btnContinueTimeup");
    if (btnContinueTimeup) btnContinueTimeup.addEventListener("click", function(){ handleMimicFailure(); });
    wireHintToggle();
  }

  // Best-effort haptic buzz — silently does nothing on devices/browsers
  // without vibration support (notably iOS Safari).
  function vibrate(pattern){
    try{ if (navigator.vibrate) navigator.vibrate(pattern); } catch(e){}
  }

  // Synthesizes a short alarm beep with the Web Audio API — no audio file
  // needed, and it can't play until a user gesture unlocks the context,
  // which the "Próxima mímica" tap already provides.
  var audioCtx = null;
  function playTimeUpAlarm(){
    vibrate([120, 80, 120, 80, 120]);
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var beepTimes = [0, 0.18, 0.36];
      beepTimes.forEach(function(t){
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + t);
        osc.stop(audioCtx.currentTime + t + 0.16);
      });
    } catch(e){ /* Web Audio unavailable — fail silently, timer UI still shows time's up */ }
  }

  // A brief two-note chime for a correct guess — quieter and shorter than
  // the alarm so it stays pleasant even with many guesses in a row.
  function playCorrectDing(){
    vibrate(50);
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      [ [0, 880], [0.09, 1320] ].forEach(function(pair){
        var t = pair[0], freq = pair[1];
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.14);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + t);
        osc.stop(audioCtx.currentTime + t + 0.15);
      });
    } catch(e){ /* Web Audio unavailable — fail silently */ }
  }

  // A soft, rising-pitch tick for the last 5 seconds of the timer — a
  // quiet urgency cue leading into the time's-up alarm.
  function playCountdownTick(secondsLeft){
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 500 + (5 - secondsLeft) * 60;
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.09);
      vibrate(20);
    } catch(e){ /* Web Audio unavailable — fail silently */ }
  }

  function startReveal(catKey){
    var draw = drawWord(catKey);
    state.activeWord = draw.word;
    state.activeCatKey = draw.catKey;
    state.remaining = state.timerSec;
    state.phase = "revealed";
    renderPanel();
    clearInterval(state.timerId);
    var start = Date.now();
    var total = state.timerSec;
    var lastTickedSecond = null;
    state.timerId = setInterval(function(){
      var elapsed = (Date.now()-start)/1000;
      var rem = Math.max(0, total - elapsed);
      state.remaining = Math.ceil(rem);
      var fill = document.getElementById("timerFill");
      var num = document.getElementById("timerNum");
      if (fill) fill.style.width = (rem/total*100)+"%";
      if (num) num.textContent = state.remaining+"s";
      if (state.remaining >= 1 && state.remaining <= 5 && state.remaining !== lastTickedSecond){
        lastTickedSecond = state.remaining;
        playCountdownTick(state.remaining);
      }
      if (rem <= 0){
        clearInterval(state.timerId);
        state.phase = "timeup";
        playTimeUpAlarm();
        renderPanel();
      }
    }, 100);
  }

  function clearTeamOverride(){
    state.teams[state.current].categoryOverride = null;
  }

  // Tallies one mimicry attempt against the team's running stats — powers
  // the end-of-game report (acertos/erros and best/worst category).
  function recordAttempt(team, correct){
    var catKey = state.activeCatKey;
    if (correct) team.correct++; else team.wrong++;
    if (!catKey) return;
    if (!team.byCategory[catKey]) team.byCategory[catKey] = {correct:0, wrong:0};
    if (correct) team.byCategory[catKey].correct++;
    else team.byCategory[catKey].wrong++;
  }

  // A correct guess resolves the house the pawn is standing on and moves it
  // 1 house forward. If that house was a mystery, its hidden nature adds a
  // bonus on top: a good one is won outright (extra advance); a bad one is
  // simply dodged — no penalty at all, since success means passing it
  // unharmed; a neutral one just does nothing either way, good or bad.
  function scoreSuccess(){
    clearInterval(state.timerId);
    playCorrectDing();
    var team = state.teams[state.current];
    recordAttempt(team, true);
    var house = state.board[team.pos];
    // Choosing "Aleatória" whenever a category choice is offered doubles
    // the normal advance on a correct guess — a risk/reward for not
    // knowing which category the word will come from.
    var baseAdvance = team.categoryOverride === "aleatoria" ? 2 : 1;
    var advanceTo = Math.min(team.pos + baseAdvance, state.finishIdx);
    clearTeamOverride();
    state.phase = "moving";
    renderPanel();
    if (house.type === "special" && house.sp === "avance2"){
      animateMove(team, team.pos, advanceTo, function(){
        animateMove(team, team.pos, Math.min(advanceTo+2, state.finishIdx), finishTurnCheckWin);
      });
    } else { // plain category, or special that was volte1/perdeVez/nada but succeeded: just the normal advance
      animateMove(team, team.pos, advanceTo, finishTurnCheckWin);
    }
  }

  function finishTurnCheckWin(){
    var team = state.teams[state.current];
    if (team.pos >= state.finishIdx){
      state.winner = team;
      renderWin();
      return;
    }
    endTurn();
  }

  // A wrong/skipped/timed-out guess never moves the team — same as failing
  // at any normal house. The only extra bit for a mystery house: if its
  // hidden nature was bad, the setback lands now; either way its nature is
  // re-rolled, so the next attempt at it is a fresh mystery again.
  function handleMimicFailure(){
    clearInterval(state.timerId);
    var team = state.teams[state.current];
    recordAttempt(team, false);
    var house = state.board[team.pos];
    if (house.type === "special"){
      var sp = house.sp;
      rerollSpecial(house);
      if (sp === "volte1"){
        state.phase = "moving";
        renderPanel();
        animateMove(team, team.pos, Math.max(team.pos-1, 0), endTurn);
        return;
      }
      if (sp === "perdeVez"){ team.skipNext = true; }
    }
    endTurn();
  }

  function openCategoryPicker(onChosen, allowAleatoria){
    var keys = state.activeCatPool.slice();
    if (allowAleatoria && state.aleatoriaEnabled) keys.push("aleatoria");
    var btns = keys.map(function(k){
      var c = CATS[k];
      var note = k === "aleatoria" ? '<small>Acertando, anda o dobro!</small>' : "";
      return '<button class="cat-pick-btn" data-cat="'+k+'" style="background:'+c.color+'"><span>'+c.icon+'</span>'+c.label+note+'</button>';
    }).join("");
    modalLayer.innerHTML = '<div class="modal-overlay"><div class="modal-card">' +
      '<h3>🎁 Escolha a categoria</h3>' +
      '<p style="color:var(--text-muted); font-size:.9rem; margin:0;">Sua próxima palavra virá da categoria que você escolher.</p>' +
      '<div class="cat-pick-grid">'+btns+'</div>' +
      '<button class="ghost-btn" id="btnCatPickBack" style="align-self:center;">← Voltar</button>' +
      '</div></div>';
    var btnCatPickBack = document.getElementById("btnCatPickBack");
    if (btnCatPickBack) btnCatPickBack.addEventListener("click", function(){ modalLayer.innerHTML = ""; });
    modalLayer.querySelectorAll("[data-cat]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.teams[state.current].categoryOverride = btn.getAttribute("data-cat");
        modalLayer.innerHTML = "";
        (onChosen || endTurn)();
      });
    });
  }

  // Just moves to the next team in rotation. Whether that team owes a
  // skipped turn (from a mystery house's "perca a vez" revés) is handled
  // right after, in endTurn — that's what shows the "perdeu a vez" screen
  // instead of silently skipping them.
  function advanceTeamIndex(){
    state.current = (state.current + 1) % state.teams.length;
  }

  function endTurn(){
    clearInterval(state.timerId);
    var justFinishedTeam = state.teams[state.current];
    if (justFinishedTeam.pos >= state.finishIdx){
      state.winner = justFinishedTeam;
      renderWin();
      return;
    }
    advanceTeamIndex();
    if (state.teams[state.current].skipNext){
      state.teams[state.current].skipNext = false;
      state.phase = "skipmsg";
    } else {
      state.phase = "idle";
    }
    renderPanel();
  }

  // Picks, for one team, the category it landed the most correct guesses in
  // and the one it missed the most — the two headline stats of its report.
  function bestWorstCategory(team){
    var bestKey = null, bestVal = 0, worstKey = null, worstVal = 0;
    Object.keys(team.byCategory).forEach(function(k){
      var s = team.byCategory[k];
      if (s.correct > bestVal){ bestVal = s.correct; bestKey = k; }
      if (s.wrong > worstVal){ worstVal = s.wrong; worstKey = k; }
    });
    return {bestKey: bestKey, worstKey: worstKey};
  }

  function renderWin(){
    var ranked = state.teams.slice().sort(function(a,b){ return b.pos - a.pos; });
    var reportRows = ranked.map(function(t, idx){
      var bw = bestWorstCategory(t);
      var bestLabel = bw.bestKey ? CATS[bw.bestKey].icon+' '+CATS[bw.bestKey].label : '—';
      var worstLabel = bw.worstKey ? CATS[bw.worstKey].icon+' '+CATS[bw.worstKey].label : '—';
      return '<div class="team-report-row">' +
        '<div class="team-report-head"><span class="pawn" style="background:'+t.color+'"></span>'+escapeHtml(t.name)+(idx===0?' 🏆':'')+'</div>' +
        '<div class="team-report-stats"><span>✅ '+t.correct+' acertos</span><span>❌ '+t.wrong+' erros</span></div>' +
        '<div class="team-report-cats"><span>Mais acertou: '+bestLabel+'</span><span>Mais errou: '+worstLabel+'</span></div>' +
      '</div>';
    }).join("");

    modalLayer.innerHTML = '<div class="modal-overlay"><div class="modal-card modal-card-wide">' +
      '<div class="confetti-emoji">🏆</div>' +
      '<h3>'+escapeHtml(state.winner.name)+' venceu!</h3>' +
      '<p style="color:var(--text-muted); margin:0;">Chegou primeiro ao final do tabuleiro. 🎉</p>' +
      '<div class="team-report-list">'+reportRows+'</div>' +
      '<button class="start-btn" id="btnPlayAgain" style="align-self:center;">Jogar novamente</button>' +
      '</div></div>';
    document.getElementById("btnPlayAgain").addEventListener("click", function(){
      modalLayer.innerHTML = "";
      state = newState(setupState.numTeams, setupState.names, setupState.timerSec, setupState.enabledCats, setupState.steps, setupState.teamColors, setupState.languageFilter==="noEnglish", setupState.languageFilter==="brazilOnly");
      renderGame();
    });
  }

  function renderGame(){
    renderPanel();
  }

  function confirmExitToMenu(){
    modalLayer.innerHTML = '<div class="modal-overlay"><div class="modal-card">' +
      '<h3>Sair para o menu principal?</h3>' +
      '<p style="color:var(--text-muted); margin:0;">A partida em andamento será perdida.</p>' +
      '<div class="result-btns"><button class="btn-skip" id="btnExitCancel">Cancelar</button><button class="btn-ok" id="btnExitConfirm">Sair</button></div>' +
      '</div></div>';
    document.getElementById("btnExitCancel").addEventListener("click", function(){ modalLayer.innerHTML = ""; });
    document.getElementById("btnExitConfirm").addEventListener("click", exitToMenu);
  }
  function exitToMenu(){
    if (state) clearInterval(state.timerId);
    modalLayer.innerHTML = "";
    gameEl.hidden = true;
    setupEl.hidden = false;
    renderSetup();
  }

  // ---------------- MANAGE WORDS SCREEN ----------------
  function updateManageButtonState(){
    var midReveal = !gameEl.hidden && state && (state.phase === "revealed" || state.phase === "moving");
    btnManage.disabled = !!midReveal;
    btnManage.title = midReveal ? "Aguarde o fim da rodada para editar as palavras" : "";
  }

  function renderManage(){
    var catKeys = Object.keys(CATS).filter(function(k){ return k !== "aleatoria"; });
    var mFilter = manageState.languageFilter;
    var tabs = catKeys.map(function(k){
      var c = CATS[k];
      var active = manageState.activeCat === k;
      var style = active ? "background:"+c.color+";border-color:"+c.color+";color:#fff;" : "";
      var total = wordBank[k].length;
      var countLabel = mFilter === "none"
        ? String(total)
        : wordsForMatch(k, mFilter === "noEnglish", mFilter === "brazilOnly").length + "/" + total;
      return '<button class="chip" data-mcat="'+k+'" style="'+style+'">'+c.icon+' '+c.label+' ('+countLabel+')</button>';
    }).join("");

    var cat = manageState.activeCat;
    var c = CATS[cat];
    var filter = manageState.languageFilter;
    var filteredWords = wordsForMatch(cat, filter === "noEnglish", filter === "brazilOnly");
    var filteredSet = {};
    filteredWords.forEach(function(w){ filteredSet[w] = true; });
    var hasTag = !!(NON_BRAZILIAN[cat] || ENGLISH_ONLY[cat]);
    var wordsHtml = wordBank[cat].map(function(w){
      var excluded = filter !== "none" && !filteredSet[w];
      return '<span class="word-chip'+(excluded?' is-filtered-out':'')+'" style="background:'+c.color+'">'+escapeHtml(w)+
        '<button class="word-x" data-rm="'+encodeURIComponent(w)+'" aria-label="Remover '+escapeHtml(w)+'">×</button></span>';
    }).join("") || '<span style="color:var(--text-muted); font-weight:600; font-size:.9rem;">Nenhuma palavra ainda — adicione a primeira abaixo.</span>';

    var langChips = '<div class="chip-row">' +
      '<button class="chip'+(filter==="none"?' is-active':'')+'" data-mlangfilter="none">Sem filtros</button>' +
      '<button class="chip'+(filter==="noEnglish"?' is-active':'')+'" data-mlangfilter="noEnglish">🌐 Sem inglês</button>' +
      '<button class="chip'+(filter==="brazilOnly"?' is-active':'')+'" data-mlangfilter="brazilOnly">🇧🇷 Versão brasileira</button>' +
      '</div>' +
      (filter !== "none"
        ? '<p class="lede">'+(hasTag
            ? 'Esmaecidas: ficariam de fora com esse filtro ativado ('+filteredWords.length+' de '+wordBank[cat].length+' continuam).'
            : 'Esta categoria não distingue idioma/origem — nenhuma palavra é afetada por este filtro.')+'</p>'
        : "");

    var statusNote = dbAvailable
      ? "As mudanças ficam salvas neste aparelho."
      : "Armazenamento indisponível agora: as mudanças valem só para esta sessão.";

    manageEl.innerHTML =
      '<div class="setup-card">' +
        '<div><h2>Gerenciar palavras</h2><p class="lede">'+statusNote+'</p></div>' +
        '<div class="field-group"><span class="field-label">Categoria</span><div class="chip-row">'+tabs+'</div></div>' +
        '<div class="field-group"><span class="field-label">Ver com o filtro</span>'+langChips+'</div>' +
        '<div class="field-group">' +
          '<span class="field-label">'+c.icon+' '+c.label+'</span>' +
          '<div class="word-list">'+wordsHtml+'</div>' +
          '<div class="add-word-row">' +
            '<input type="text" id="newWordInput" placeholder="Adicionar palavra..." maxlength="60">' +
            '<button class="chip is-active" id="btnAddWord">Adicionar</button>' +
          '</div>' +
        '</div>' +
        '<button class="ghost-btn" id="btnBackFromManage" style="align-self:flex-start;">← Voltar</button>' +
      '</div>';

    manageEl.querySelectorAll("[data-mcat]").forEach(function(btn){
      btn.addEventListener("click", function(){
        manageState.activeCat = btn.getAttribute("data-mcat");
        renderManage();
      });
    });
    manageEl.querySelectorAll("[data-mlangfilter]").forEach(function(btn){
      btn.addEventListener("click", function(){
        manageState.languageFilter = btn.getAttribute("data-mlangfilter");
        renderManage();
      });
    });
    manageEl.querySelectorAll("[data-rm]").forEach(function(btn){
      btn.addEventListener("click", function(){
        removeWord(cat, decodeURIComponent(btn.getAttribute("data-rm")));
      });
    });
    var input = document.getElementById("newWordInput");
    document.getElementById("btnAddWord").addEventListener("click", function(){
      addWord(cat, input.value); input.value = ""; input.focus();
    });
    input.addEventListener("keydown", function(e){
      if (e.key === "Enter"){ addWord(cat, input.value); input.value = ""; }
    });
    document.getElementById("btnBackFromManage").addEventListener("click", closeManage);
  }

  function openManage(){
    if (btnManage.disabled) return;
    manageState.returnTo = gameEl.hidden ? "setup" : "game";
    setupEl.hidden = true;
    gameEl.hidden = true;
    manageEl.hidden = false;
    renderManage();
  }
  function closeManage(){
    manageEl.hidden = true;
    if (manageState.returnTo === "game"){ gameEl.hidden = false; }
    else { setupEl.hidden = false; renderSetup(); }
  }
  btnManage.addEventListener("click", openManage);

  function showQrCode(){
    modalLayer.innerHTML = '<div class="modal-overlay" id="qrOverlay"><div class="modal-card">' +
      '<h3>Jogue no seu aparelho</h3>' +
      '<p style="color:var(--text-muted); margin:0;">Aponte a câmera do celular ou tablet pro código e instale o app pela tela inicial.</p>' +
      '<div class="qr-box">'+APP_QR_SVG+'</div>' +
      '<p class="qr-link">'+APP_URL+'</p>' +
      '<button class="start-btn" style="align-self:center;" id="btnQrClose">Fechar</button>' +
      '</div></div>';
    document.getElementById("btnQrClose").addEventListener("click", function(){ modalLayer.innerHTML = ""; });
    document.getElementById("qrOverlay").addEventListener("click", function(e){
      if (e.target.id === "qrOverlay") modalLayer.innerHTML = "";
    });
  }
  btnQr.addEventListener("click", showQrCode);

  renderSetup();
  initWordBank();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
